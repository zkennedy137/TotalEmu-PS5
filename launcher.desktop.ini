# Desktop test config: run from the project folder.
# desktop_cmd runs a real PC emulator in place of the PS5 title, e.g.
#   desktop_cmd=pcsx2-qt -batch {game}
# Leave it empty to only log what would be launched.

[launcher]
data_dir=./testdata/data
exit_after_launch=false

[system.ps1]
name=PlayStation
title_id=PPSA98510
games_dir=./testdata/ps1
extensions=.m3u,.cue,.chd,.pbp,.iso
bios_any=./testdata/bios/ps1/SCPH1001.BIN|./testdata/bios/ps1/scph5501.bin
pass_game=true
desktop_cmd=sleep 1; echo "PS1 emulator would boot" {game}

[system.ps2]
name=PlayStation 2
title_id=PPSA00000
games_dir=./testdata/ps2
extensions=.iso,.chd
bios_any=./testdata/bios/ps2/scph39001.bin

[system.ps3]
name=PlayStation 3
title_id=PPSA99303
games_dir=./testdata/ps3
marker=PS3_GAME
bios_all=./testdata/bios/ps3/PS3UPDAT.PUP
