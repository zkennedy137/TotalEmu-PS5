# PS Launcher config for the PS5. Copy to /data/PSLauncher/launcher.ini
# Lists use | between paths and , between extensions.

[launcher]
data_dir=/data/PSLauncher
# Close the launcher after starting an emulator, so the emulator gets the memory.
exit_after_launch=true
# Debug_Menu=1 shows the Debug row in Settings (the L2, R2, L2, R2 sequence on the Version page sets it).
# http_probe=1 runs the network test when the launcher starts.
Debug_Menu=0
http_probe=0
# DC_onstartup=1 skips the wait for the drives when the launcher starts (Settings > Disable Drive Check on Startup).
DC_onstartup=0
# UseApi=1 lets cover downloads use TheGamesDB and RAWG (with your keys). ApiToUse picks which: libretro, TheGamesDB, RAWG or all.
UseApi=0
ApiToUse=all

# Your own API keys (each user's own; never shared with the app). Empty = that source is off.
# TheGamesDB: https://thegamesdb.net (log in, then your key is on the API Key page)
# RAWG: https://rawg.io/apidocs (free key)
[api]
thegamesdb_key=
rawg_key=

[system.ps1]
name=PlayStation
# Runs the built-in PSSwanStation core inside this app (no separate title).
builtin_core=true
# Put your PS1 BIOS here: scph5501.bin (US), scph5500.bin (JP), scph5502.bin (EU).
# Without one the core uses OpenBIOS (lower compatibility).
system_dir=/data/PSLauncher/bios/ps1
games_dir=/data/SwanStationPS5/games|/mnt/usb0/SwanStationPS5/games
extensions=.cue
bios_any=/data/PSLauncher/bios/ps1/SCPH1001.bin|/data/PSLauncher/bios/ps1/scph5501.bin|/data/PSLauncher/bios/ps1/scph5500.bin|/data/PSLauncher/bios/ps1/scph5502.bin
pass_game=false

[system.ps2]
name=PlayStation 2
# PS5SX2 (the PS2 emulator), at /data/homebrew/PPSA99203
title_id=PPSA99203
games_dir=/data/PSLauncher/games/ps2
extensions=.iso,.chd,.cso,.bin
# Put the PS2 BIOS files here. Any file named scph-xxxxx.bin or scphxxxxx.bin counts (any version).
bios_dir=/data/PSLauncher/bios/ps2
bios_name=scph
# PS5SX2 starts the game named in this file (its disc-launch.txt): line 1 the game, line 2 its serial.
launch_file=/data/PCSX2/logs/disc-launch.txt
pass_game=false

[system.ps3]
name=PlayStation 3
# RPCS3-5 (PPSA99303): it starts the game named after --boot. Its games are in its own rpcs3/games folder; PS3 games
# copied to /data/PSLauncher/games/ps3 are listed too.
title_id=PPSA99303
games_dir=/data/homebrew/PPSA99303/rpcs3/games|/data/PSLauncher/games/ps3
marker=PS3_GAME
extensions=.iso
launch_arg=--boot
# RPCS3-5's config: PS Launcher turns off its "start games after boot" before starting it.
config_file=/data/homebrew/PPSA99303/rpcs3/config.yml
bios_all=/data/PSLauncher/bios/ps3/PS3UPDAT.PUP
pass_game=false

# PS4 and PS5 tabs: discs that are not PS1, PS2 or PS3 are listed here, but cannot be started or installed yet.
[system.ps4]
name=PlayStation 4
pass_game=false

[system.ps5]
name=PlayStation 5
# An installed PS5 game's title ID (PPSA plus five digits, from the console). Listed as one game that starts it. Empty = none.
title_id=
pass_game=false
